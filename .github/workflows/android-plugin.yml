name: Android Plugin Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example android-plugin-v2026.06.08.1"
        required: true
  push:
    tags:
      - "android-plugin-v*"

permissions:
  contents: write

jobs:
  build-android-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^android-plugin-v[0-9] ]]; then
            echo "Release tag must start with android-plugin-v" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c

      - name: Replace Gradle mirrors with official sources
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.aliyun.com/d' android/settings.gradle.kts

      - name: Build Android plugin libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:buildMihomoPluginLibraries --no-daemon

      - name: Verify JNI symbols
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          so="android/app/build/generated/jniLibs/mihomo/arm64-v8a/libmihomo_plugin.so"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$so" | tee android-plugin-symbols.txt
          grep -q 'Java_info_loveyu_mfca_plugin_MihomoPluginCore_nativeGetVersion' android-plugin-symbols.txt
          grep -q 'Java_info_loveyu_mfca_plugin_MihomoPluginCore_nativeStart' android-plugin-symbols.txt
          grep -q 'Java_info_loveyu_mfca_plugin_MihomoPluginCore_nativeStop' android-plugin-symbols.txt
          grep -q 'Java_info_loveyu_mfca_plugin_MihomoPluginCore_nativeIsRunning' android-plugin-symbols.txt

      - name: Package plugin libraries
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          mkdir -p dist/jniLibs
          cp -R android/app/build/generated/jniLibs/mihomo/. dist/jniLibs/
          (cd dist && zip -r "../mihomo-android-jniLibs-${tag}.zip" jniLibs)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "dist/jniLibs/${abi}/libmihomo_plugin.so" "libmihomo_plugin-${abi}-${tag}.so"
          done
          sha256sum "mihomo-android-jniLibs-${tag}.zip" libmihomo_plugin-*-"${tag}".so > "mihomo-android-plugin-${tag}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: |
            mihomo-android-jniLibs-${{ steps.release.outputs.tag }}.zip
            libmihomo_plugin-arm64-v8a-${{ steps.release.outputs.tag }}.so
            libmihomo_plugin-armeabi-v7a-${{ steps.release.outputs.tag }}.so
            libmihomo_plugin-x86_64-${{ steps.release.outputs.tag }}.so
            libmihomo_plugin-x86-${{ steps.release.outputs.tag }}.so
            mihomo-android-plugin-${{ steps.release.outputs.tag }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
